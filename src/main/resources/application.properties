spring.application.name=enterprise-messages-server
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nnpro}
spring.datasource.username=${DB_USERNAME:nnpro}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

registration.username.min-length=${REGISTRATION_USERNAME_MIN_LENGTH:3}
registration.username.max-length=${REGISTRATION_USERNAME_MAX_LENGTH:50}
registration.password.min-length=${REGISTRATION_PASSWORD_MIN_LENGTH:6}

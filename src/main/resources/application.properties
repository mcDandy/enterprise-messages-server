spring.application.name=${SPRING_APPLICATION_NAME:enterprise-messages-server}
spring.jackson.deserialization.fail-on-unknown-properties=${SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES:true}
spring.jackson.deserialization.fail-on-trailing-tokens=${SPRING_JACKSON_DESERIALIZATION_FAIL_ON_TRAILING_TOKENS:true}
spring.jackson.mapper.allow-coercion-of-scalars=${SPRING_JACKSON_MAPPER_ALLOW_COERCION_OF_SCALARS:false}
spring.jackson.read.strict-duplicate-detection=${SPRING_JACKSON_READ_STRICT_DUPLICATE_DETECTION:true}
server.port=${SERVER_PORT:8080}
api.max-request-body-bytes=${API_MAX_REQUEST_BODY_BYTES:1048576}
api.limits.http-concurrent-requests=${API_MAX_CONCURRENT_REQUESTS:128}
api.limits.websocket-concurrent-messages=${WS_MAX_CONCURRENT_MESSAGES:32}
api.limits.websocket-connections=${WS_MAX_CONNECTIONS:2000}

server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:20s}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
server.tomcat.max-keep-alive-requests=${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
server.tomcat.max-parameter-count=${SERVER_TOMCAT_MAX_PARAMETER_COUNT:100}
server.tomcat.max-http-form-post-size=${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:1MB}
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:1MB}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nnpro}
spring.datasource.username=${DB_USERNAME:nnpro}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

registration.username.min-length=${REGISTRATION_USERNAME_MIN_LENGTH:3}
registration.username.max-length=${REGISTRATION_USERNAME_MAX_LENGTH:50}
registration.password.min-length=${REGISTRATION_PASSWORD_MIN_LENGTH:6}

spring.application.name=enterprise-messages-server
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.read.strict-duplicate-detection=true
server.port=8080
api.max-request-body-bytes=${API_MAX_REQUEST_BODY_BYTES:1048576}
api.limits.http-concurrent-requests=${API_MAX_CONCURRENT_REQUESTS:128}
api.limits.websocket-concurrent-messages=${WS_MAX_CONCURRENT_MESSAGES:32}
api.limits.websocket-connections=${WS_MAX_CONNECTIONS:2000}

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-keep-alive-requests=100
server.max-http-request-header-size=16KB
server.tomcat.max-parameter-count=100
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nnpro}
spring.datasource.username=${DB_USERNAME:nnpro}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

registration.username.min-length=${REGISTRATION_USERNAME_MIN_LENGTH:3}
registration.username.max-length=${REGISTRATION_USERNAME_MAX_LENGTH:50}
registration.password.min-length=${REGISTRATION_PASSWORD_MIN_LENGTH:6}

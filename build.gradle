plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cz.upce.fei.EMS'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-websocket:4.0.2'

	implementation 'org.springframework.boot:spring-boot-starter-security:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-json:4.0.2'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.2'

	implementation 'org.springframework.boot:spring-boot-starter-actuator:4.0.2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools:4.0.2'

	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test:4.0.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.2'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-web:4.0.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.2'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	testImplementation 'org.springframework.security:spring-security-test:7.0.2'

	runtimeOnly 'org.postgresql:postgresql:42.7.9'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test:4.0.2'

	testImplementation 'com.h2database:h2:2.4.240'
}

tasks.named('test') {
	useJUnitPlatform()
	environment 'SWAGGER_PASSWORD', 'test-swagger-password'
}

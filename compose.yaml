services:
  db:
    image: postgres:17
    container_name: ems-postgres
    environment:
      POSTGRES_DB: nnpro
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: ems-adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .
    image: nnpro-backend:dev
    container_name: ems-server
    environment:
      DB_URL: jdbc:postgresql://db:5432/nnpro
      DB_USERNAME: nnpro
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_PORT: 8443
      SERVER_SSL_ENABLED: true
      SERVER_SSL_KEY_STORE: file:/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: secret123
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: ems-backend
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - .:/app
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nnpro
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # No ports: PostgreSQL is accessible only on this Compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/nnpro}
      DB_USERNAME: ${DB_USERNAME:-nnpro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SERVER_PORT: 8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/run/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Set TLS_KEYSTORE_PASSWORD in .env}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: ems-backend
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    volumes:
      - type: bind
        source: ./certs/keystore.p12
        target: /run/certs/keystore.p12
        read_only: true
        bind:
          create_host_path: false
    # Random host port; each backend instance gets its own published port.
    ports:
      - "8443"
    depends_on:
      db:
        condition: service_healthy

  db-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_DB: nnpro_test
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    # Isolated, disposable database: NEVER the regular app's postgres_data.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: build
    environment:
      GRADLE_USER_HOME: /tmp/gradle-clean
      DB_URL: jdbc:postgresql://db-test:5432/nnpro_test
      DB_USERNAME: nnpro
      DB_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    command: ["./gradlew", "test", "--no-daemon"]
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres_data:

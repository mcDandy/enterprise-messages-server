services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nnpro
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

  backend1:
    build: .
    image: nnpro-backend:dev
    environment:
      DB_URL: jdbc:postgresql://db:5432/nnpro
      DB_USERNAME: nnpro
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      db:
        condition: service_healthy

  backend2:
    build: .
    image: nnpro-backend:dev
    environment:
      DB_URL: jdbc:postgresql://db:5432/nnpro
      DB_USERNAME: nnpro
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

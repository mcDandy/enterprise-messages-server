services:
  db:
    container_name: ${DB_CONTAINER_NAME:-ems-db}
    image: ghcr.io/pgmq/pg17-pgmq:v1.10.0
    environment:
      POSTGRES_DB: nnpro
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # PostgreSQL stays on the internal Compose network (db:5432).
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development-only certificate provisioning. Runs in Docker, not on the host.
  # Existing private keys are always reused, never silently regenerated.
  cert-init:
    container_name: ${CERT_INIT_CONTAINER_NAME:-cert-init}
    image: eclipse-temurin:21-jdk
    environment:
      TLS_HOST: ${TLS_HOST:-localhost}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Set TLS_KEYSTORE_PASSWORD in .env}
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs
      - ./scripts/ensure-dev-cert.sh:/opt/ems/ensure-dev-cert.sh:ro
    entrypoint: ["/bin/sh", "/opt/ems/ensure-dev-cert.sh"]
    restart: "no"

  # Export public Android configuration once the certificate is available.
  # Uses an isolated Gradle project to avoid resolving backend dependencies.
  client-config:
    image: eclipse-temurin:21-jdk
    # Cert directory is read-only. Writes only public files to client-config/.
    user: "0:0"
    environment:
      TLS_HOST: ${TLS_HOST:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      GRADLE_USER_HOME: /gradle-cache
    volumes:
      - ./scripts/client-config-docker.sh:/opt/ems/client-config-docker.sh:ro
      - ./scripts/client-config-docker.gradle:/workspace/build.gradle:ro
      - ./gradlew:/workspace/gradlew:ro
      - ./gradle/wrapper:/workspace/gradle/wrapper:ro
      - ./gradle/client-config.gradle:/workspace/gradle/client-config.gradle:ro
      - client_config_gradle_home:/gradle-cache
      - ${TLS_CERTS_DIR:-./certs}:/certs:ro
      - ./client-config:/client-config
    entrypoint: ["/bin/sh", "/opt/ems/client-config-docker.sh"]
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: "no"

  backend:
    container_name: ${BACKEND_CONTAINER_NAME:-ems-server}
    build:
      context: .
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/nnpro}
      DB_USERNAME: ${DB_USERNAME:-nnpro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:?Set SWAGGER_PASSWORD in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-enterprise-messages-server}
      SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES: ${SPRING_JACKSON_DESERIALIZATION_FAIL_ON_UNKNOWN_PROPERTIES:-true}
      SPRING_JACKSON_DESERIALIZATION_FAIL_ON_TRAILING_TOKENS: ${SPRING_JACKSON_DESERIALIZATION_FAIL_ON_TRAILING_TOKENS:-true}
      SPRING_JACKSON_MAPPER_ALLOW_COERCION_OF_SCALARS: ${SPRING_JACKSON_MAPPER_ALLOW_COERCION_OF_SCALARS:-false}
      SPRING_JACKSON_READ_STRICT_DUPLICATE_DETECTION: ${SPRING_JACKSON_READ_STRICT_DUPLICATE_DETECTION:-true}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      API_MAX_CONCURRENT_REQUESTS: ${API_MAX_CONCURRENT_REQUESTS:-128}
      WS_MAX_CONCURRENT_MESSAGES: ${WS_MAX_CONCURRENT_MESSAGES:-32}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-2000}
      SERVER_PORT: ${SERVER_PORT:-8443}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-200}
      SERVER_TOMCAT_THREADS_MIN_SPARE: ${SERVER_TOMCAT_THREADS_MIN_SPARE:-10}
      SERVER_TOMCAT_MAX_CONNECTIONS: ${SERVER_TOMCAT_MAX_CONNECTIONS:-8192}
      SERVER_TOMCAT_ACCEPT_COUNT: ${SERVER_TOMCAT_ACCEPT_COUNT:-100}
      SERVER_TOMCAT_CONNECTION_TIMEOUT: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:-20s}
      SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:-20s}
      SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS: ${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:-100}
      SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:-16KB}
      SERVER_TOMCAT_MAX_PARAMETER_COUNT: ${SERVER_TOMCAT_MAX_PARAMETER_COUNT:-100}
      SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE: ${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:-1MB}
      SERVER_TOMCAT_MAX_SWALLOW_SIZE: ${SERVER_TOMCAT_MAX_SWALLOW_SIZE:-1MB}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-20}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:-5}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:-5000}
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:-1000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_JPA_OPEN_IN_VIEW: ${SPRING_JPA_OPEN_IN_VIEW:-false}
      REGISTRATION_USERNAME_MIN_LENGTH: ${REGISTRATION_USERNAME_MIN_LENGTH:-3}
      REGISTRATION_USERNAME_MAX_LENGTH: ${REGISTRATION_USERNAME_MAX_LENGTH:-50}
      REGISTRATION_PASSWORD_MIN_LENGTH: ${REGISTRATION_PASSWORD_MIN_LENGTH:-6}
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/run/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Set TLS_KEYSTORE_PASSWORD in .env}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: ems-backend
    volumes:
      - type: bind
        source: ${TLS_CERTS_DIR:-./certs}
        target: /run/certs
        read_only: true
    # Use unique HTTPS_PORT and TLS_CERTS_DIR for each independent installation.
    ports:
      - "${HTTPS_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-8443}:8443"
    depends_on:
      db:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
      client-config:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: postgres:17
    profiles: ["migrate"]
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      PGHOST: db
      PGDATABASE: nnpro
      PGUSER: nnpro
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate-db.sh:/migrate-db.sh:ro
    entrypoint: ["/bin/sh", "/migrate-db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  db-test:
    profiles: ["test"]
    image: ghcr.io/pgmq/pg17-pgmq:v1.10.0
    environment:
      POSTGRES_DB: nnpro_test
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    volumes:
      - pgmq_test_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Keep this readiness check schema-agnostic: migrate-test applies pending migrations
    # only *after* db-test is healthy. Checking pending tables here deadlocks it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Only for devs who run tests from IntelliJ on Windows
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-55432}:5432"

  migrate-test:
    profiles: ["test"]
    image: postgres:17
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      PGHOST: db-test
      PGDATABASE: nnpro_test
      PGUSER: nnpro
      PGPASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate-db.sh:/migrate-db.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until pg_isready -h "$${PGHOST}" -U "$${PGUSER}" -d "$${PGDATABASE}";
        do sleep 1; done;
        exec /bin/sh /migrate-db.sh
    depends_on:
      db-test:
        condition: service_started
    restart: "no"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: build
    environment:
      GRADLE_USER_HOME: /tmp/gradle-clean
      DB_URL: jdbc:postgresql://db-test:5432/nnpro_test
      DB_USERNAME: nnpro
      DB_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
      TEST_DB_URL: jdbc:postgresql://db-test:5432/nnpro_test
      TEST_DB_USERNAME: nnpro
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    command: ["./gradlew", "test", "--no-daemon"]
    depends_on:
      db-test:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully

volumes:
  postgres_data:
  pgmq_test_data:
  client_config_gradle_home:

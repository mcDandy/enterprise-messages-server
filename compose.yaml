services:
  db:
    container_name: ${DB_CONTAINER_NAME:-db}
    image: postgres:17
    environment:
      POSTGRES_DB: nnpro
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # PostgreSQL stays on the internal Compose network (db:5432).
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development-only certificate provisioning. Runs in Docker, not on the host.
  # Existing private keys are always reused, never silently regenerated.
  cert-init:
    container_name: ${CERT_INIT_CONTAINER_NAME:-cert-init}
    image: eclipse-temurin:21-jdk
    environment:
      TLS_HOST: ${TLS_HOST:-localhost}
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Set TLS_KEYSTORE_PASSWORD in .env}
    volumes:
      - ${TLS_CERTS_DIR:-./certs}:/certs
      - ./scripts/ensure-dev-cert.sh:/opt/ems/ensure-dev-cert.sh:ro
    entrypoint: ["/bin/sh", "/opt/ems/ensure-dev-cert.sh"]
    restart: "no"

  backend:
    container_name: ${BACKEND_CONTAINER_NAME:-ems-server}
    build:
      context: .
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/nnpro}
      DB_USERNAME: ${DB_USERNAME:-nnpro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SERVER_PORT: 8443
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/run/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD:?Set TLS_KEYSTORE_PASSWORD in .env}
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: ems-backend
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    volumes:
      - type: bind
        source: ${TLS_CERTS_DIR:-./certs}
        target: /run/certs
        read_only: true
    # Use unique HTTPS_PORT and TLS_CERTS_DIR for each independent installation.
    ports:
      - "${HTTPS_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-8443}:8443"
    depends_on:
      db:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: postgres:17
    profiles: ["migrate"]
    environment:
      PGHOST: db
      PGDATABASE: nnpro
      PGUSER: nnpro
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./scripts/migrate-db.sh:/migrate-db.sh:ro
    entrypoint: ["/bin/sh", "/migrate-db.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  adminer:
    image: adminer:latest
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  db-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_DB: nnpro_test
      POSTGRES_USER: nnpro
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    # Never uses the application's postgres_data volume.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nnpro -d nnpro_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Only for devs who run tests from IntelliJ on Windows
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-55432}:5432"

  tests:
    profiles: ["test"]
    build:
      context: .
      target: build
    environment:
      GRADLE_USER_HOME: /tmp/gradle-clean
      DB_URL: jdbc:postgresql://db-test:5432/nnpro_test
      DB_USERNAME: nnpro
      DB_PASSWORD: ${TEST_DB_PASSWORD:-nnpro_local_test}
    command: ["./gradlew", "test", "--no-daemon"]
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres_data:
